$kind: collection
name: "SELARAS API"
description: |-
  Dokumentasi dan test API backend SELARAS: aplikasi audit kualitas data pertumbuhan balita.

  ## Cara memakai
  1. Jalankan backend dengan `APP_ENV=development` di `backend/.env`. Tanpa itu cookie bertanda `Secure` dan tidak terkirim lewat HTTP.
  2. Impor `backend/data_dummy.sql`.
  3. Di Postman, pilih environment **SELARAS Lokal**.
  4. Kirim **01 Auth / Login**, atau jalankan seluruh koleksi dengan Run. Urutan folder penting, karena beberapa request memakai id dari request sebelumnya.

  Satu kali run memakai 3 percobaan login dari jatah 10 per 15 menit. Bila muncul 429, tunggu atau restart backend.

  ## Autentikasi
  Cookie HttpOnly `selaras_token` dari Login, berlaku 8 jam. Tidak ada header Authorization dan tidak ada endpoint register; akun dibuat admin lewat CLI di server (`./selaras petugas-baru ...`).

  ## Prinsip data
  API hanya menerima angka agregat. Data balita tidak pernah dikirim ke server. Semua data dibatasi ke puskesmas petugas yang login.

  ## Kode status
  | Kode | Arti |
  |---|---|
  | 200 / 201 | Berhasil |
  | 400 | Input tidak valid atau angka tidak konsisten |
  | 401 | Belum login, sesi berakhir, atau email/password salah |
  | 404 | Tidak ditemukan, atau milik puskesmas/petugas lain |
  | 409 | Nama posyandu kembar |
  | 413 | Body lebih dari 16 KB |
  | 415 | POST/PUT bukan application/json |
  | 429 | Terlalu banyak percobaan login |

  Semua error berbentuk `{ "error": "pesan" }`.
variables:
  posyanduBaruId: ""
  posyanduBaruNama: ""
  auditId: ""
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      // Berjalan setelah setiap request di koleksi ini.
      pm.test('[kontrak] Tidak ada error server', function () {
          pm.expect(pm.response.code).to.be.below(500);
      });

      pm.test('[kontrak] Respons berupa JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
