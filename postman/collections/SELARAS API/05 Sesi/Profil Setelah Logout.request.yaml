$kind: http-request
name: "Profil Setelah Logout"
description: |-
  Setelah logout, endpoint yang butuh login membalas 401. Jalankan Login lagi untuk melanjutkan.
method: GET
url: "{{baseUrl}}/api/saya"
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 401', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Ada pesan error', function () {
          pm.expect(pm.response.json().error).to.be.a('string').and.not.empty;
      });
