$kind: http-request
name: "Ganti Password Lama Salah"
description: |-
  Password baru harus 10 sampai 72 karakter.

  Bila password lama benar, respons 200 berisi `{ "message": "Password diganti. Silakan login ulang." }`, cookie dihapus, dan semua sesi petugas itu berakhir. Contoh yang berhasil sengaja tidak disertakan karena akan mengubah password akun demo; untuk mengembalikannya, impor ulang `backend/data_dummy.sql`.
method: PUT
url: "{{baseUrl}}/api/password"
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password_lama": "bukan-password-ini",
      "password_baru": "PasswordBaru2026!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });

      pm.test('Ada pesan error', function () {
          pm.expect(pm.response.json().error).to.be.a('string').and.not.empty;
      });
