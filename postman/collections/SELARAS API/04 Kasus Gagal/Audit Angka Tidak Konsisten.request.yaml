$kind: http-request
name: "Audit Angka Tidak Konsisten"
description: |-
  17 + 2 tidak sama dengan 20, ditolak CHECK constraint di MySQL.
method: POST
url: "{{baseUrl}}/api/audit"
order: 3000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "posyandu_id": "{{posyanduMelatiId}}",
      "periode": "{{periode}}",
      "jumlah_sampel": 20,
      "jumlah_tercatat_asik": 17,
      "jml_tidak_ada_di_asik": 2,
      "jml_tidak_sesuai": 3,
      "jml_selisih_tanggal": 0,
      "jml_selisih_bb": 2,
      "jml_selisih_tb": 1,
      "jml_terlambat": 4
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });

      pm.test('Ada pesan error', function () {
          pm.expect(pm.response.json().error).to.be.a('string').and.not.empty;
      });
