$kind: http-request
name: "Login Akun Nonaktif"
description: |-
  Akun Hendra Wijaya di data dummy sudah dinonaktifkan.
method: POST
url: "{{baseUrl}}/api/login"
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "hendra.wijaya@selarass.id",
      "password": "Petugas@123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 401', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Ada pesan error', function () {
          pm.expect(pm.response.json().error).to.be.a('string').and.not.empty;
      });
