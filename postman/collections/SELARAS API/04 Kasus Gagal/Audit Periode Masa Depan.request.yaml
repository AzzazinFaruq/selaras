$kind: http-request
name: "Audit Periode Masa Depan"
description: |-
  Periode tidak boleh melewati bulan berjalan.
method: POST
url: "{{baseUrl}}/api/audit"
order: 4000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "posyandu_id": "{{posyanduMelatiId}}",
      "periode": "2999-01",
      "jumlah_sampel": 20,
      "jumlah_tercatat_asik": 17,
      "jml_tidak_ada_di_asik": 3,
      "jml_tidak_sesuai": 3,
      "jml_selisih_tanggal": 0,
      "jml_selisih_bb": 2,
      "jml_selisih_tb": 1,
      "jml_terlambat": 4
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });

      pm.test('Ada pesan error', function () {
          pm.expect(pm.response.json().error).to.be.a('string').and.not.empty;
      });
