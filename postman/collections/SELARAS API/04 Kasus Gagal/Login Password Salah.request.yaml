$kind: http-request
name: "Login Password Salah"
description: |-
  Pesannya sama dengan email yang tidak terdaftar, supaya tidak bisa dipakai menebak email.
method: POST
url: "{{baseUrl}}/api/login"
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "salah"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 401', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Ada pesan error', function () {
          pm.expect(pm.response.json().error).to.be.a('string').and.not.empty;
      });

      pm.test('Pesan tidak membedakan email dan password', function () {
          pm.expect(pm.response.json().error).to.eql('Email atau password salah');
      });
